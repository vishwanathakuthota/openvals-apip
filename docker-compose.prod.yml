services:
  api:
    image: ghcr.io/openvals/apip-api:${IMAGE_TAG:?set IMAGE_TAG}
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "8000:8000"

  worker:
    image: ghcr.io/openvals/apip-worker:${IMAGE_TAG:?set IMAGE_TAG}
    env_file:
      - .env
    restart: unless-stopped

  web:
    image: ghcr.io/openvals/apip-web:${IMAGE_TAG:?set IMAGE_TAG}
    environment:
      WEB_PUBLIC_API_BASE_URL: ${WEB_PUBLIC_API_BASE_URL:?set WEB_PUBLIC_API_BASE_URL}
      APIP_API_BASE_URL: ${APIP_API_BASE_URL:?set APIP_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
