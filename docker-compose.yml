services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apip
      POSTGRES_PASSWORD: apip
      POSTGRES_DB: apip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apip -d apip"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - apip_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - apip_redis_data:/data
    ports:
      - "6379:6379"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  seed:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.example
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.db.seed"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.example
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.example
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.example
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/apip-celerybeat-schedule"
      ]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      WEB_PUBLIC_API_BASE_URL: http://api:8000
      APIP_API_BASE_URL: http://api:8000
      APIP_PUBLIC_API_KEY: apip_live_local_dev_key
      APIP_DEMO_EMAIL: admin@openvalidations.com
      APIP_DEMO_PASSWORD: apip-admin-change-me
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  apip_postgres_data:
  apip_redis_data:
