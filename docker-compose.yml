services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apip
      POSTGRES_PASSWORD: apip
      POSTGRES_DB: apip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apip -d apip"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - apip_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - apip_redis_data:/data
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.example
    depends_on:
      redis:
        condition: service_healthy

volumes:
  apip_postgres_data:
  apip_redis_data:
